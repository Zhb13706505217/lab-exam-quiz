<!doctype html>
<html lang="zh-CN" data-fs="m">
<head>
<meta charset="utf-8">
<title>上岗证刷题 · 第1章 基础知识</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1AA179">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="上岗证刷题">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <section class="view" id="v-home">
    <div class="scroll" id="homeScroll"></div>
  </section>

  <section class="view" id="v-setup">
    <div class="boxtop">
      <div class="topbar">
        <button class="icon-btn" data-act="back-home" aria-label="返回">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <div style="font-size:18px;font-weight:700">选择练习范围</div>
      </div>
    </div>
    <div class="scroll noTab" id="setupScroll"></div>
    <div style="padding:10px 16px calc(14px + var(--safe-b));background:var(--bg)">
      <button class="btn btn-primary" data-act="start-round">开始本轮答题</button>
    </div>
  </section>

  <section class="view" id="v-quiz">
    <div class="boxtop">
      <div class="topbar">
        <button class="icon-btn" data-act="ask-exit" aria-label="退出本轮">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <div class="progress">
          <div class="num"><span id="qIndex"></span><span id="qLive"></span></div>
          <div class="bar"><i id="qBar" style="width:0%"></i></div>
        </div>
      </div>
    </div>
    <div class="quizscroll" id="quizScroll"></div>
    <div class="boxbottom" id="quizBottom"></div>
  </section>

  <section class="view" id="v-result">
    <div class="scroll noTab" id="resultScroll"></div>
  </section>

  <section class="view" id="v-wrong">
    <div class="scroll" id="wrongScroll"></div>
  </section>

  <section class="view" id="v-stats">
    <div class="scroll" id="statsScroll"></div>
  </section>

  <section class="view" id="v-me">
    <div class="scroll" id="meScroll"></div>
  </section>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-tab="home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>首页</button>
    <button class="tab" data-tab="wrong">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M6 3.5h9.5L20 8v12.5H6z"/><path d="M9.5 13.5h7M9.5 17h5"/></svg>错题本</button>
    <button class="tab" data-tab="stats">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 19V9M10 19V4M16 19v-7M22 19H2"/></svg>统计</button>
    <button class="tab" data-tab="me">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20c1.3-3.7 4-5.4 7.5-5.4S18.2 16.3 19.5 20"/></svg>我的</button>
  </nav>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="bank.js"></script>
<script src="app.js"></script>
</body>
</html>
